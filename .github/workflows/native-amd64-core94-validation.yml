name: Frozen native AMD64 Core 2026.9.4 validation

on:
  push:
    branches: [codex/native-amd64-validation]
    paths:
      - native-validation-core94/**
      - .github/workflows/native-amd64-core94-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homecircle-native-amd64-core94-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frozen-candidate-core94:
    if: github.ref == 'refs/heads/codex/native-amd64-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the isolated validation revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Run frozen offline native, backend, upgrade and recovery validation
        shell: bash
        run: |
          bash native-validation-core94/run_native.sh \
            --payload native-validation-core94/payload \
            --output native-core94-results
          test -s native-core94-results/public-summary/host.json
          test -s native-core94-results/public-summary/setup-summary.json
          test -s native-core94-results/public-summary/candidate-summary.json
          jq -e '.outcome=="passed" and .container_stopped==true and .container_removed==true and .cleanup_failed==false' \
            native-core94-results/public-summary/host.json
      - name: Retain only sanitized summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-amd64-core94-sanitized-summary
          path: native-core94-results/public-summary/*.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false

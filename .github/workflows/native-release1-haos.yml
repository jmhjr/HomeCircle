name: HomeCircle development preview managed HAOS restore checks

on:
  push:
    branches: [codex/native-amd64-validation]
    paths:
      - native-release1-haos/**
      - .github/workflows/native-release1-haos.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homecircle-release1-managed-haos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-preview-prepared-restore:
    if: github.ref == 'refs/heads/codex/native-amd64-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    steps:
      - name: Check out exact reviewed controls and preview input
        timeout-minutes: 3
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install native VM tools
        timeout-minutes: 10
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Check fixture contracts and exact unreleased package
        timeout-minutes: 2
        working-directory: native-release1-haos
        run: python3 -B -m unittest discover -v -p 'test_*.py'
      - name: Record operational restoration and guard limitation separately
        timeout-minutes: 97
        shell: bash
        run: |
          set +e
          bash native-release1-haos/run_host.sh \
            --candidate-zip native-release1-haos/payload/homecircle.zip \
            --branch-commit "$GITHUB_SHA" --output native-release1-haos-results
          investigation_status=$?
          set -e
          python3 -B native-release1-haos/accept_investigation.py \
            --exit-code "$investigation_status" \
            --summary native-release1-haos-results/public-summary/host.json
      - name: Retain only narrow exact-preview receipts
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release1-preview-managed-haos-prepared-restore
          path: native-release1-haos-results/public-summary/*.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false

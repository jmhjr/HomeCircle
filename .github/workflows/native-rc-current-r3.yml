name: HomeCircle frozen RC current qualification after test and collection corrections

on:
  push:
    branches: [codex/native-amd64-validation]
    paths:
      - native-rc-current-r3/**
      - .github/workflows/native-rc-current-r3.yml

permissions:
  contents: read

concurrency:
  group: homecircle-rc-current-r3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rc-current-r3:
    if: github.ref == 'refs/heads/codex/native-amd64-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out reviewed packet and canonical source history
        timeout-minutes: 3
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify every exact frozen input before importing helpers
        timeout-minutes: 2
        run: |
          python3 -I -B - <<'PYCODE'
          import hashlib,pathlib,stat
          root=pathlib.Path('native-rc-current-r3')
          expected={'CONFIG.sha256': '6ba9ac82a81510cc277be117d77b666df75146dfcd39242ee2dd5fbdea664aed', 'PREPARED.json': '27ad6fd049195736ca9213cb9921c43048b57965d896543af4eba90b81ee499d', 'README.md': 'f6111c0272191a75676e21f957be6b1f06a87ce1021ffecb96b02293f37dce95', 'driver.py': '445ec6d2edb008c5c7aa050472f53f1a527fcc47b3c7c35fc763b14660489709', 'payload/baseline-vault.py': '7c6a846cefba6a34647d84b7738a93d85738a948da32fbf752a96c4e1cf4c0f2', 'payload/config.json': 'abbca6a0e77d57225cd1cdbaeca361ea1982c0042d0e15bb6dc730494b1e8a03', 'payload/homecircle.zip': '4f94a18e2f7862e9bd7f4c85250e5f10e4b8e1292ea9d7b263b441d2e1b77dd9', 'payload/inventory.json': 'e4bc34e3921e75157402cf643f87ed658d95c76505a448abb393fd90a304db12', 'payload/source-inventory.json': '866c4d39b18182dc1be6749b943040e81e9604731327a2e58a5d250648dc4915', 'payload/source.tgz': '5e28c35ef4e103ad4531503376c9485466521fff1879e229bb6c3fae6495b865', 'requirements_support.py': '91bb0d92bfeef8021184275369d8923e8b951d2cb7b85a31bd34414101e3a513', 'run_host.sh': '6b39953237a88ec750732c5913b6e7f523717cca3151723b2a2f036762eb8fba', 'test_driver.py': '6bc737a5228c58f2add5db4f5a8fe209affe566dfbc167fbf540652855eba3ed'}
          actual={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file() or p.is_symlink()}
          assert actual==set(expected),'frozen_input_members_refused'
          assert not any(p.is_symlink() for p in root.rglob('*')),'frozen_input_symlink_refused'
          for name,digest in expected.items():
              path=root/name
              assert stat.S_ISREG(path.lstat().st_mode) and hashlib.sha256(path.read_bytes()).hexdigest()==digest,'frozen_input_bytes_refused'
          print('All frozen inputs verified.')
          PYCODE
      - name: Use reviewed frontend toolchain
        timeout-minutes: 3
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 23.7.0
      - name: Verify safe standalone harness contracts
        timeout-minutes: 3
        run: |
          bash -n native-rc-current-r3/run_host.sh
          python3 -I -B - <<'PYCODE'
          import sys,unittest
          sys.path.insert(0,'native-rc-current-r3')
          suite=unittest.defaultTestLoader.loadTestsFromName('test_driver')
          assert suite.countTestCases()==49,'host_contract_count_refused'
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun==49 and not result.skipped,'host_contract_result_refused'
          PYCODE
      - name: Run full current-Core backend frontend privacy and package qualification
        timeout-minutes: 62
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=150s 3500s bash native-rc-current-r3/run_host.sh \
            --payload "$PWD/native-rc-current-r3/payload" \
            --output "$RUNNER_TEMP/rc-current-r3-results" \
            --pins-sha abbca6a0e77d57225cd1cdbaeca361ea1982c0042d0e15bb6dc730494b1e8a03 \
            --source-repository "$GITHUB_WORKSPACE"
          jq -e '.outcome=="passed" and .container_stopped==true and .container_removed==true and .cleanup_failed==false and .private_workspace_removed==true and .release_assets_checked==true and .candidate_zip_sha256=="4f94a18e2f7862e9bd7f4c85250e5f10e4b8e1292ea9d7b263b441d2e1b77dd9"' \
            "$RUNNER_TEMP/rc-current-r3-results/public-summary/host.json"
      - name: Retain only bounded safe qualification receipts
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rc-current-r3-validation-receipts
          path: ${{ runner.temp }}/rc-current-r3-results/public-summary/*.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
      - name: Retain exact frozen RC package rebuilt by native qualification
        timeout-minutes: 3
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unreleased-rc-current-r3-candidate
          path: ${{ runner.temp }}/rc-current-r3-results/release-assets/*
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

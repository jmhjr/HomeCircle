name: HomeCircle instrumented enabled saved-account restore
on:
  push:
    branches: [codex/native-amd64-validation]
    paths:
      - native-release1-enabled-saved-restore/**
      - .github/workflows/native-release1-enabled-saved-restore.yml
permissions:
  contents: read
concurrency:
  group: homecircle-instrumented-enabled-saved-restore-${{ github.ref }}
  cancel-in-progress: false
jobs:
  instrumented-enabled-saved-restore:
    if: github.ref == 'refs/heads/codex/native-amd64-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    steps:
      - name: Check out exact reviewed procedure and qualified preview
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify every frozen fixture file before imports
        timeout-minutes: 3
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, re, stat, subprocess
          root = Path('native-release1-enabled-saved-restore')
          expected = {'README.md': '259fcd94897c58d7ed5cc63eba8b34c64be3c7a637e3ce2e1253bf6d68b53140', 'accept_saved_storage.py': 'c501dadde40f4871cdc79f52c0ce9b4f34aa17637960eae1c38e6e167fe5ada5', 'baseline-controls.json': '40e7cfbeb72a16e44b16e294a8ad97d8798c786bf8633b900750997d9dd52942', 'controller.py': 'ced996c5063613a8d93b0f5f54e7da014d6bf3c4d4dd7be98a13e9e9f363403c', 'enabled_protocol.py': '20a1ef04e45af772bc83c87dd54fc613f462f97b697dcb6db1ee8d135c956915', 'guard_context.py': '7d69de4b10ae725795c42a4089f61cb972a3d48c5f6032680eea26c935ef5922', 'guard_transfer.py': '590030e0c7eff81457e56c4cfc7b0d75ad0c079be3ede6e6da083d8fb4e95d84', 'guest_helper/homecircle_safe_restore_qa/__init__.py': '74e81116ab3fde35000877ac74fe2a923edf1be4f51594e69f9e1eaf4e3a99de', 'guest_helper/homecircle_safe_restore_qa/dependency_probe.py': '7ac8e79aa5aea1868801e9273d9d1300db525b51bd7fe70a0a03a836a506a8d6', 'guest_helper/homecircle_safe_restore_qa/manifest.json': 'c27acdd8393091d2d97a0334ee08ae3cf806929801a83f3a9d4033c35c35624e', 'guest_helper/homecircle_safe_restore_qa/startup_boundary.py': 'ad5fa5fea68d38a6d863e431cb2d7a075b2edfc62d0fd684a6c7d0707f875c86', 'payload/homecircle.zip': '004c9bc4a968ad395e18033837cb42f5bd1d8719a8d90fc778fd20be4ff08f97', 'payload/inventory.json': 'd7e70cb639d77836fa2ac15b26f95e2f31ea599dbfff580cfae60a5a827cfe5b', 'payload/provenance.json': '64e5794f8a98c75a50fb67df829dfd484033fe1b07e7029e54c863e0d870c9e7', 'prepare_dependencies.py': 'df492a082a8f668a2f175aaf39e3eaf4ae8205684e7c3495854591449fb11835', 'reset_fresh_config.py': 'df600d5695de2d09feabcded9e59d81dcc8149be2082b19b7931e0f11f12aa3c', 'run_host.sh': '19e047f20d970b1728b790fba65354335b6a957a74362f457379d40e2f55ac1f', 'storage_context.py': '4b828bbc5d00c37698ec892f8d24fbea736982d0b65c445efd1f9abc91f6da60', 'storage_protocol.json': 'b73b35a2895a6db71d250d01da72c98f7c15cb14dc8e6c16872b772d36c654d3', 'storage_transfer.py': '8ea5a1100aed6c43b9e98f6a14b76129b76ccd3abaf2d049bc3f7c02d673cdc1', 'test_enabled_guest.py': '68f01a93ac6589a9862fad77c5e2b1f79fc582813b9b0f8e0bc7e1e69261fca5', 'test_enabled_storage.py': '524a404a60d69a3bb3c1ae950cc6cc590e0a8667e316d04d0df5b92c45532cdc', 'test_guard_context.py': 'a7525d54f499de631ec183a30aa07c98b8bc454678d14f9dd4c30ae57d90a32d', 'test_saved_storage.py': '824c123eefc26d740f8d78ac6e65b808cb9c5ade6aa8420fd11c95d933c3f52c', 'test_startup_boundary.py': 'ba75bbbc42e6ff6bb41309187fc566f897f5e8d10a1df305d0dde86a068823b0', 'test_storage_context.py': 'adb7a7a4594a385a581f03b873779300558776de6da1b73ba10d9b09a5062182', 'test_storage_transfer.py': '925afdd54c8f452a961fe15cdaa351de71fc0d9058e53ac2fcbe9bc416effa4d'}
          assert type(expected) is dict and expected, 'frozen_map_refused'
          assert root.is_dir() and not root.is_symlink(), 'fixture_root_refused'
          tracked = subprocess.check_output(['git', 'ls-files', '-z', '--', str(root)]).decode().split('\0')
          assert {name for name in tracked if name} == {str(root / name) for name in expected}, 'tracked_members_refused'
          nodes = list(root.rglob('*'))
          assert all(not path.is_symlink() and (path.is_file() or path.is_dir()) for path in nodes), 'fixture_node_refused'
          assert {path.relative_to(root).as_posix() for path in nodes if path.is_file()} == set(expected), 'fixture_members_refused'
          for name, digest in expected.items():
              relative = PurePosixPath(name)
              assert type(name) is str and name == relative.as_posix() and not relative.is_absolute() and '..' not in relative.parts
              assert type(digest) is str and re.fullmatch('[0-9a-f]{64}', digest), 'frozen_hash_refused'
              path = root / name
              assert stat.S_ISREG(path.lstat().st_mode) and hashlib.sha256(path.read_bytes()).hexdigest() == digest, 'input_bytes_refused'
          print('Verified all', len(expected), 'frozen enabled-restore inputs.')
          PY
      - name: Install native VM tools
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          test -r /usr/share/OVMF/OVMF_CODE_4M.fd
          test -r /usr/share/OVMF/OVMF_VARS_4M.fd
      - name: Require all 186 zero-skip enabled-restore contracts
        timeout-minutes: 3
        shell: bash
        run: |
          bash -n native-release1-enabled-saved-restore/run_host.sh
          unset HOMECIRCLE_STORAGE_IDENTITY_SOURCE
          PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('native-release1-enabled-saved-restore', pattern='test_*.py')
          assert suite.countTestCases() == 186, 'contract_count_refused'
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and not result.skipped, 'contract_failure_or_skip'
          PY
      - name: Witness instrumented enabled restore under default Supervisor conditions
        timeout-minutes: 103
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout --signal=TERM --kill-after=150s 5900s bash native-release1-enabled-saved-restore/run_host.sh \
            --candidate-zip native-release1-enabled-saved-restore/payload/homecircle.zip \
            --branch-commit "$GITHUB_SHA" --output native-release1-enabled-saved-results
          receipts=native-release1-enabled-saved-results/public-summary
          python3 -I -B native-release1-enabled-saved-restore/accept_saved_storage.py "$receipts"
          python3 -I -B native-release1-enabled-saved-restore/guard_context.py --accept-public "$receipts/host.json"
          python3 -I -B native-release1-enabled-saved-restore/storage_context.py --accept-public "$receipts/host.json"
          python3 -I -B - <<'PY'
          from pathlib import Path
          import json, stat
          root = Path('native-release1-enabled-saved-results/public-summary')
          expected = {'host.json', 'baseline_enabled.json', 'mutated_enabled.json',
                      'automatic_restored_enabled.json', 'repaired_storage_enabled.json', 'restart_enabled.json'}
          assert root.is_dir() and not root.is_symlink(), 'receipt_root_refused'
          nodes = list(root.iterdir())
          assert {path.name for path in nodes} == expected, 'six_receipts_required'
          for path in nodes:
              info = path.lstat()
              assert stat.S_ISREG(info.st_mode) and not path.is_symlink() and 0 < info.st_size <= 1024**2, 'receipt_file_refused'
              assert type(json.loads(path.read_bytes())) is dict, 'receipt_json_refused'
          PY
      - name: Retain only six fixed synthetic enabled-restore receipts
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release1-instrumented-enabled-saved-restore
          path: |
            native-release1-enabled-saved-results/public-summary/host.json
            native-release1-enabled-saved-results/public-summary/baseline_enabled.json
            native-release1-enabled-saved-results/public-summary/mutated_enabled.json
            native-release1-enabled-saved-results/public-summary/automatic_restored_enabled.json
            native-release1-enabled-saved-results/public-summary/repaired_storage_enabled.json
            native-release1-enabled-saved-results/public-summary/restart_enabled.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false

name: Native HAOS HACS release controller contracts

on:
  push:
    branches: [codex/native-amd64-validation]
    paths:
      - .github/workflows/native-haos-hacs-release-contracts.yml

permissions:
  contents: read

concurrency:
  group: homecircle-native-haos-hacs-release-contracts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-controller-contracts:
    if: github.ref == 'refs/heads/codex/native-amd64-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the isolated validation revision
        timeout-minutes: 2
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify the offline controller safety contracts
        timeout-minutes: 2
        shell: bash
        run: |
          cd native-haos-hacs-release
          python3 -B -m unittest -v test_controller.py

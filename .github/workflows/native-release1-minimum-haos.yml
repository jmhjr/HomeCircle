name: HomeCircle minimum Core managed HAOS checks

on:
  push:
    branches: [codex/native-amd64-validation]
    paths:
      - native-release1-minimum-haos/**
      - .github/workflows/native-release1-minimum-haos.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homecircle-release1-minimum-haos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  managed-minimum-core:
    if: github.ref == 'refs/heads/codex/native-amd64-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    steps:
      - name: Check out exact reviewed controls and preview input
        timeout-minutes: 3
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install native VM tools
        timeout-minutes: 10
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Check exact-input and ownership contracts
        timeout-minutes: 3
        working-directory: native-release1-minimum-haos
        run: |
          python3 -B - <<'PYTHON'
          import unittest
          suite = unittest.defaultTestLoader.discover('.', pattern='test_*.py')
          if suite.countTestCases() != 40:
              raise SystemExit('reviewed_contract_count_refused')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PYTHON
      - name: Verify normal managed dependency setup and restart on minimum Core
        timeout-minutes: 97
        shell: bash
        run: |
          bash native-release1-minimum-haos/run_host.sh \
            --candidate-zip native-release1-minimum-haos/payload/homecircle.zip \
            --branch-commit "$GITHUB_SHA" --output native-release1-minimum-haos-results
          jq -e '.outcome=="passed" and .phases==2 and .cleanup_failed==false and
            .qemu_stopped==true and .private_workspace_removed==true' \
            native-release1-minimum-haos-results/public-summary/host.json
      - name: Retain only narrow managed minimum-Core receipts
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release1-minimum-core-managed-haos
          path: native-release1-minimum-haos-results/public-summary/*.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
